<footer class="footer-bar film-grain">
      <button
        id="footer-actions-toggle"
        class="footer-actions-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="footer-actions-panel"
      >
        Options
      </button>
      <div id="footer-actions-panel" class="footer-actions-panel" aria-hidden="false">
        <div class="footer-group footer-demo-group" aria-label="Demo audio">
          <div id="footer-demo-audio-container" class="footer-demo-audio-container">
            <!-- Demo audio controls rendered by JavaScript -->
          </div>
        </div>
        <div class="footer-group footer-tools-group" aria-label="Tools">
          <button class="footer-btn" type="button">TUNER</button>
          <button class="footer-btn" id="footer-midi-btn" type="button">MIDI</button>
          <button class="footer-btn metronome-only" id="footer-riff-record-btn" type="button">REC</button>
        </div>
        <div class="footer-group footer-tempo-group" aria-label="Tempo">
          <button class="bpm-display metronome-only" id="footer-bpm-btn" type="button" title="Set BPM">
            <span id="footer-bpm-value">120.0</span> BPM
          </button>
          <div class="footer-bpm-panel metronome-only" id="footer-bpm-panel" aria-hidden="true">
            <label class="footer-bpm-field">
              <span>BPM</span>
              <input type="number" id="footer-bpm-input" min="30" max="300" step="1" />
            </label>
            <input type="range" id="footer-bpm-slider" min="30" max="300" step="1" />
          </div>
          <button class="footer-btn" id="footer-tap-btn" type="button">TAP</button>
          <button
            class="footer-btn footer-metronome-btn metronome-only"
            id="footer-metronome-btn"
            type="button"
            aria-label="Metronome"
            title="Metronome"
          >
            <svg class="footer-metronome-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M9 3.5h6L19 20.5H5L9 3.5Z" />
              <path d="M10 7.5h4" />
              <path d="M12 8.5v7" />
              <path d="M12 10.5l2.75-1.75" />
            </svg>
          </button>
          <button class="footer-metronome-play-btn metronome-only" id="footer-metronome-toggle" type="button" aria-label="Start metronome" aria-pressed="false" title="Start metronome">
            <svg class="footer-metronome-play-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          </button>
        </div>
        <div class="footer-group footer-view-group footer-right" aria-label="View options">
          <div class="footer-zoom-control">
            <select id="zoom-level-select" class="footer-demo-select themed-select zoom-level-select" aria-label="UI zoom level" title="UI zoom level"></select>
          </div>
          <div class="footer-theme-select">
            <select id="theme-select" class="footer-demo-select themed-select" aria-label="Theme" title="Theme"></select>
          </div>
        </div>
      </div>
    </footer>
