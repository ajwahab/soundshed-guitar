<section class="control-bar film-grain">
  <button class="control-bar-collapse-btn" id="control-bar-collapse-btn" type="button"
    aria-expanded="true" aria-label="Collapse controls" title="Collapse controls">
    <svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true">
      <path d="M3.5 5.75 8 10.25l4.5-4.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <div class="control-bar-body">
    <div class="control-bar-body-inner">
      <div class="control-bar-tabs" role="tablist" aria-label="Control bar sections">
        <button
          class="control-bar-tab is-active"
          id="control-bar-preset-tab"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="control-bar-preset-panel"
          data-control-bar-tab="preset"
        >Preset</button>
        <button
          class="control-bar-tab"
          id="control-bar-controls-tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="control-bar-controls-panel"
          data-control-bar-tab="controls"
        >Controls</button>
      </div>
      <div class="control-bar-panel control-bar-controls-panel" id="control-bar-controls-panel" role="tabpanel" aria-labelledby="control-bar-controls-tab">
        <!--#include:ui-components/input-control-group.html-->
        <!--#include:ui-components/output-control-group.html-->
      </div>
      <div class="control-bar-panel control-bar-preset-panel is-active" id="control-bar-preset-panel" role="tabpanel" aria-labelledby="control-bar-preset-tab">
        <!--#include:ui-components/preset-group.html-->
      </div>
    </div>
  </div>
  <!--#include:ui-components/preset-library-popover.html-->
</section>
