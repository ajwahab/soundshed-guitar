name: Build Windows

on:
  workflow_dispatch:
    
permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: windows-${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    env:
      R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      HAS_GCP_AUTH: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_SERVICE_ACCOUNT != '' }}
      HAS_WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT_CHAIN_PEM_B64 != '' }}
      HAS_R2_CREDENTIALS: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.CLOUDFLARE_API_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Typescript
        run: npm install -g typescript

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GUITARFX_WINDOWS_CMAKE_GENERATOR = 'Visual Studio 18 2026'
          .\build_windows.bat '${{ matrix.arch }}'

      - name: Resolve installer path
        id: installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Path '.\juce\packaging\Output' -Filter '*.exe' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $installer) {
            throw 'No Windows installer .exe found in juce\\packaging\\Output'
          }

          "installer_path=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "installer_name=$($installer.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Authenticate to Google Cloud
        if: ${{ env.HAS_GCP_AUTH == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        if: ${{ env.HAS_GCP_AUTH == 'true' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Cloud KMS CNG provider
        if: ${{ env.HAS_GCP_AUTH == 'true' && env.HAS_WINDOWS_SIGNING_CERT == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cngZip = Join-Path $env:RUNNER_TEMP 'kmscng.zip'
          $cngDir = Join-Path $env:RUNNER_TEMP 'kmscng'
          Invoke-WebRequest -Uri 'https://github.com/GoogleCloudPlatform/kms-integrations/releases/download/cng-v1.4/kmscng-1.4-windows-amd64.zip' -OutFile $cngZip
          Expand-Archive -Path $cngZip -DestinationPath $cngDir -Force

          $msi = Get-ChildItem -Path $cngDir -Filter '*.msi' -Recurse | Select-Object -First 1
          if (-not $msi) {
            throw 'kmscng.msi not found in the downloaded CNG provider archive'
          }

          $installLog = Join-Path $env:RUNNER_TEMP 'kmscng-install.log'
          $proc = Start-Process -FilePath msiexec.exe -ArgumentList @('/i', "`"$($msi.FullName)`"", '/quiet', '/norestart', '/log', "`"$installLog`"") -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Get-Content $installLog -ErrorAction SilentlyContinue
            throw "kmscng install failed with exit code $($proc.ExitCode)"
          }

      - name: Sign installer with SignTool (Google Cloud KMS)
        if: ${{ env.HAS_GCP_AUTH == 'true' && env.HAS_WINDOWS_SIGNING_CERT == 'true' }}
        shell: pwsh
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_KMS_LOCATION: ${{ secrets.GCP_KMS_LOCATION }}
          GCP_KMS_KEYRING: ${{ secrets.GCP_KMS_KEYRING }}
          GCP_KMS_KEY: ${{ secrets.GCP_KMS_KEY }}
          GCP_KMS_KEY_VERSION: ${{ secrets.GCP_KMS_KEY_VERSION }}
          WINDOWS_SIGNING_CERT_CHAIN_PEM_B64: ${{ secrets.WINDOWS_SIGNING_CERT_CHAIN_PEM_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          [IO.File]::WriteAllBytes('.\codesign-chain.pem', [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_CHAIN_PEM_B64))

          $signtool = Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter 'signtool.exe' -Recurse |
            Where-Object { $_.FullName -like '*\x64\*' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            throw 'signtool.exe not found; ensure the Windows SDK is installed on the runner'
          }

          $keyVersion = "projects/$env:GCP_PROJECT_ID/locations/$env:GCP_KMS_LOCATION/keyRings/$env:GCP_KMS_KEYRING/cryptoKeys/$env:GCP_KMS_KEY/cryptoKeyVersions/$env:GCP_KMS_KEY_VERSION"
          $installerPath = '${{ steps.installer.outputs.installer_path }}'

          & $signtool.FullName sign /v /debug /fd sha256 /t http://timestamp.digicert.com `
            /f .\codesign-chain.pem `
            /csp "Google Cloud KMS Provider" `
            /kc "$keyVersion" `
            "$installerPath"

          if ($LASTEXITCODE -ne 0) {
            throw "signtool failed with exit code $LASTEXITCODE"
          }

      - name: Prepare release asset
        id: asset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content '.\juce\VERSION' -Raw).Trim()
          $assetName = "SoundshedGuitar-$version-Windows-${{ matrix.arch }}-setup.exe"
          $assetPath = Join-Path $PWD $assetName
          Copy-Item '${{ steps.installer.outputs.installer_path }}' $assetPath -Force

          "asset_name=$assetName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "asset_path=$assetPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-${{ matrix.arch }}-installer
          path: ${{ steps.asset.outputs.asset_path }}
          if-no-files-found: error

      - name: Install Wrangler
        if: ${{ env.R2_BUCKET != '' }}
        shell: pwsh
        run: npm install -g wrangler@4

      - name: Upload artifact to Cloudflare R2
        if: ${{ env.R2_BUCKET != '' && env.HAS_R2_CREDENTIALS == 'true' }}
        shell: pwsh
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $key = "builds/${{ github.ref_name }}/${{ github.run_id }}/windows/${{ matrix.arch }}/${{ steps.asset.outputs.asset_name }}"
          wrangler r2 object put "$env:R2_BUCKET/$key" --file "${{ steps.asset.outputs.asset_path }}" --remote
